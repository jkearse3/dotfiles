# Repository-wide registry of secret contracts, grouped by consumer scope.
# This file is committed but holds no values and names no concrete provider: the
# provider is machine-local state mapped to the `dotfiles` alias. See
# docs/secrets.md.
[project]
name = "dotfiles"
revision = "1.0"

# Automatic launchers must not carry boilerplate audit reasons. 0.18 otherwise
# defaults this policy to "agents", which would require --reason on every run.
require_reason = false

[profiles.default]
EXA_API_KEY = { description = "Optional Exa API key for higher search limits; absent enables Exa's free tier", required = false }

# A consumer selects only its scope. Excluded secrets are stripped from the child
# environment even if inherited from the parent.
[scopes.opencode]
secrets = ["EXA_API_KEY"]

[scopes.omp]
secrets = ["EXA_API_KEY"]

[scopes.pi]
secrets = ["EXA_API_KEY"]
