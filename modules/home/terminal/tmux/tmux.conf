# TokyoNight Night colors
# Source: https://github.com/folke/tokyonight.nvim
set -g @fg "#c0caf5"
set -g @bg "#292e42"
set -g @black "#1a1b26"
set -g @red "#f7768e"
set -g @green "#9ece6a"
set -g @yellow "#e0af68"
set -g @blue "#7aa2f7"
set -g @magenta "#bb9af7"
set -g @cyan "#7dcfff"
set -g @white "#a9b1d6"
set -g @orange "#ff9e64"

# Default shell
set -g default-command fish

# Mouse support
set -g mouse on

# Sensible defaults
set -sg escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g aggressive-resize on

# Start numbering at 1
set -g base-index 1
set -g pane-base-index 1

# Status bar
set -g status-position top
set -g status-style "bg=#{@black},fg=#{@fg}"
set -g status-left "#[fg=#{@black},bg=#{@blue},bold] #S #[fg=#{@blue},bg=#{@black}]"
set -g status-left-length 30
set -g status-right "#[fg=#{@white}]%H:%M "
set -g status-right-length 30

# Window status
set -g window-status-format "#[fg=#{@white},bg=#{@black}] #I:#W "
set -g window-status-current-format "#[fg=#{@black},bg=#{@blue}] #I:#W #[fg=#{@blue},bg=#{@black}]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#{@bg}"
set -g pane-active-border-style "fg=#{@blue}"
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_title} "

# Allow OSC passthrough (e.g. Claude Code pane titles)
set -g allow-passthrough on

# Message style
set -g message-style "bg=#{@bg},fg=#{@fg}"
set -g message-command-style "bg=#{@bg},fg=#{@fg}"

# Selection/copy mode
set -g mode-style "bg=#{@bg},fg=#{@fg}"

# Window/pane numbering
set -g renumber-windows on

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation (1-9 already work via base-index)
bind -r C-h previous-window
bind -r C-l next-window

# Move windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Session management (s is already session list by default)
# prefix + s = choose session (built-in)
# prefix + $ = rename session (built-in)
# prefix + d = detach (built-in)
bind Space last-window
bind C-Space switch-client -l

# Pane management
bind X kill-pane
bind S setw synchronize-panes

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Copy mode improvements
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# True color support
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",ghostty:Tc"

# Extended key reporting
set -g extended-keys on
set -g extended-keys-format csi-u
# tmux has no built-in feature table for xterm-ghostty, so it must be told
# Ghostty supports extended keys; without this, modified keys (e.g. pi's
# shift+enter and disambiguated esc) are not negotiated through tmux.
set -as terminal-features 'xterm-ghostty:extkeys'

# Focus events for vim
set -g focus-events on

# Resurrect plugin
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
run-shell ~/.config/tmux/plugins/resurrect/resurrect.tmux
