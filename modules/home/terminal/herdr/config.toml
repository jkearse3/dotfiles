onboarding = false

[terminal]
default_shell = "fish"

[theme]
name = "tokyo-night"
auto_switch = false

[keys]
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+q"

# jj workspace counterparts of new_worktree and remove_worktree, from the
# dotfiles.jj-workspaces plugin.
[[keys.command]]
key = "prefix+ctrl+g"
type = "plugin_action"
command = "dotfiles.jj-workspaces.add"
description = "new jj workspace"

[[keys.command]]
key = "prefix+ctrl+q"
type = "plugin_action"
command = "dotfiles.jj-workspaces.remove"
description = "remove jj workspace"

# Fuzzy finder over agents and workspaces, from the dotfiles.find plugin. The
# built-in go-to stays on prefix+g.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "dotfiles.find.open"
description = "find"
