onboarding = false

[terminal]
default_shell = "fish"

[theme]
name = "tokyo-night"
auto_switch = false

[keys]
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
open_worktree = "prefix+shift+o"
# Unbinds Herdr's Git new-worktree key so the jj workspace action below can
# take prefix+shift+g: Git worktrees bypass jj, and every checkout here is a
# jj workspace.
new_worktree = ""

# The jj workspace actions of the dotfiles.jj-workspaces plugin, in place of
# Herdr's Git worktree keys. remove_worktree has no default key, so Git
# worktrees are removed from Herdr's right-click menu.
[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "dotfiles.jj-workspaces.add"
description = "new jj workspace"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "dotfiles.jj-workspaces.remove"
description = "remove jj workspace"

# Fuzzy finder over agents and workspaces, from the dotfiles.find plugin. The
# built-in go-to stays on prefix+g.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "dotfiles.find.open"
description = "find"
