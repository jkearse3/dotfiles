# Tracked defaults loaded before the `dotfiles` profile selected by the wrapper.
# Machine-local preferences and project trust belong in
# ~/.codex/dotfiles.config.toml; trusted repositories may override these in
# .codex/config.toml, and one-off experiments can use `codex -c key=value`.

approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
check_for_update_on_startup = false
cli_auth_credentials_store = "keyring"
model = "gpt-5.6-sol"
model_reasoning_effort = "low"
service_tier = "default"

[tui]
alternate_screen = "always"
raw_output_mode = false
notifications = false
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "git-branch",
  "current-dir",
]
terminal_title = [
  "spinner",
  "project",
  "git-branch",
  "model",
  "task-progress",
]
animations = true
show_tooltips = false

[sandbox_workspace_write]
network_access = false

[shell_environment_policy]
# Apply Codex's automatic KEY/SECRET/TOKEN filtering to spawned commands.
ignore_default_excludes = false
