[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jj-worktree"
version = "0.0.0"
description = "Manage isolated jj repositories backed by detached Git worktrees"
requires-python = ">=3.11"

[project.scripts]
jj-worktree = "jj_worktree.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
