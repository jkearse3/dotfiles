[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-message"
version = "0.0.0"
description = "Format and check commit descriptions"
requires-python = ">=3.11"

[project.scripts]
commit-message = "commit_message.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
