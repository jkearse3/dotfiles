[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jj-worktree-add"
version = "0.0.0"
description = "Create a detached Git worktree with independent jj state"
requires-python = ">=3.11"

[project.scripts]
jj-worktree-add = "jj_worktree_add.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
