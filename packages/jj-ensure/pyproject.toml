[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jj-ensure"
version = "0.0.0"
description = "Ensure a Git checkout has compatible jj state"
requires-python = ">=3.11"

[project.scripts]
jj-ensure = "jj_ensure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
