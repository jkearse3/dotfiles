preset = "all"
project-includes = [
  "modules/home/agents/skills/**/scripts",
  "modules/home/vcs/jj/migrate-jj-sign-on-push",
  "packages/commit-message",
  "packages/direnv-worktree",
  "packages/herdr-jj-workspaces",
  "packages/nix-cleanup",
  "packages/scratch-sweep",
  "packages/jjx",
  "packages/token-count",
  "packages/worktree-include",
]
search-path = [
  "packages/commit-message/src",
  "packages/herdr-jj-workspaces/src",
  "packages/jjx/src",
  "packages/nix-cleanup",
  "packages/scratch-sweep",
]

# A unittest fixture declares its attributes on the class and assigns them in
# `setUp`, which runs before every test; this rule does not count assignments
# in `setUp` as initialization, so it would flag every such fixture.
[[sub-config]]
matches = "**/tests/**"

[sub-config.errors]
uninitialized-instance-variable = false
